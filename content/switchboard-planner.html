<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switchboard Planner</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#d9d6cf;--ac:#2f5d8a;--on:#fff;--em:#ecebe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--card:#222427;--tx:#e8e8e6;--mu:#9aa0a6;--bd:#3a3d41;--ac:#7fb0e0;--on:#101214;--em:#2c2f33}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 8px}
.version{font-size:12px;font-weight:400;color:var(--ac);text-decoration:underline;margin-left:8px;vertical-align:middle}
.home-tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin:14px 0;overflow-x:auto}.tab{font:inherit;background:transparent;color:var(--mu);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}.tab.active{color:var(--tx);border-bottom-color:var(--ac);font-weight:700}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{font:inherit;border:1px solid var(--bd);background:var(--em);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.danger{background:#c0392b;color:#fff;border-color:#a5301f}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}.fold{border:0;background:transparent;color:var(--tx);font:20px/1 system-ui;cursor:pointer;padding:4px 6px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.menu .btn{padding:14px 6px;font-weight:600}
@media(max-width:520px){.menu{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
textarea{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;min-height:180px;resize:vertical}
textarea[data-description]{font:15px/1.4 system-ui,sans-serif;min-height:70px}
label{display:block;margin:10px 0;font-size:13px;color:var(--mu)}label input,label select{margin-top:4px;color:var(--tx);font-size:15px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}td:last-child,th:last-child{text-align:right}
.plate{display:grid;gap:3px;padding:8px;border-radius:8px;border:1px solid rgba(0,0,0,.25);margin:8px 0}
.cell{border-radius:5px;font-size:10px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;word-break:break-word;padding:2px}
.it{border:1px solid;font-weight:600}
.em{border:1px dashed}
[data-a]{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip.on{background:var(--ac);color:var(--on)}
.msg{color:#b3261e;font-size:13px;margin:6px 0}
.pl{border-top:1px solid var(--bd);padding-top:6px;margin-top:6px}
.hint{background:var(--em);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mu);margin-bottom:10px}
.totals{margin:14px 0 10px;padding:0}.totals summary{cursor:pointer;padding:12px;font-weight:700;list-style-position:inside}.totals[open] summary{border-bottom:1px solid var(--bd)}.totals-body{padding:8px 12px 12px}
.color-total{padding-top:12px;text-align:left}.swatch{display:inline-block;width:14px;height:14px;border:1px solid var(--bd);border-radius:3px;vertical-align:middle;margin-right:7px}
/* Interaction feedback across mouse, touch, and keyboard. */
:where(.btn,.tab,.fold,.version,.totals summary,.cell[data-a],input,select,textarea){transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,filter .15s ease,transform .15s ease}
@media(hover:hover){
  .btn:not(:disabled):hover{filter:brightness(1.09);border-color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.16)}
  .tab:hover,.fold:hover,.totals summary:hover{background:var(--em);color:var(--tx)}
  .version:hover{filter:brightness(1.2);text-decoration-thickness:2px}
  :where(input,select,textarea):not(:disabled):hover{border-color:var(--ac)}
  .cell[data-a]:hover{outline:2px solid var(--ac);outline-offset:-2px;filter:brightness(1.1);transform:scale(1.02);z-index:1}
}
:where(.btn,.tab,.fold,.version,.totals summary,.cell[data-a]):active{transform:translateY(1px) scale(.98);filter:brightness(.9)}
:where(.btn,.tab,.fold,.version,.totals summary,.cell[data-a],input,select,textarea):focus-visible{outline:2px solid var(--ac);outline-offset:2px;box-shadow:0 0 0 4px var(--bg)}
:where(input,select,textarea):focus{border-color:var(--ac)}
@media(prefers-reduced-motion:reduce){:where(.btn,.tab,.fold,.version,.totals summary,.cell[data-a],input,select,textarea){transition:none}}
</style></head>
<body><div id="app"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<input type="file" id="fiSchema" accept=".json,application/json" hidden>
<script>
/* ---- Schema: individual plate types and modules available for projects. ---- */
const uid=()=>Math.random().toString(36).slice(2,8);
const seedSchema=()=>({name:'My Schema',colors:{},plates:[],components:[],electricals:[]});
/* ---- Project: rooms and placed copies of plate and module types. ---- */
const seedProject=()=>({name:'My Project',author:'',description:'',rooms:{},roomOrder:[],roomElectricals:{}});
const record=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const unique=a=>new Set(a).size===a.length;
const validSchema=j=>{if(!record(j)||typeof j.name!=='string'||!record(j.colors)||!Array.isArray(j.plates)||!Array.isArray(j.components))return false;
const colorNames=Object.keys(j.colors);if(!colorNames.every(n=>n&&/^#[0-9a-f]{6}$/i.test(j.colors[n])))return false;
const platesOK=j.plates.every(t=>record(t)&&typeof t.id==='string'&&t.id&&Number.isInteger(t.capacity)&&t.capacity>=1&&t.capacity<=24&&Number.isInteger(t.rows)&&t.rows>=1&&t.capacity%t.rows===0&&typeof t.description==='string'&&Object.hasOwn(j.colors,t.colorName)&&t.colorCode===j.colors[t.colorName]);
const modulesOK=j.components.every(c=>record(c)&&typeof c.id==='string'&&c.id&&typeof c.name==='string'&&c.name&&[1,2].includes(c.modules)&&typeof c.description==='string'&&Object.hasOwn(j.colors,c.color)&&c.colorCode===j.colors[c.color]);
const electricalsOK=j.electricals===undefined||Array.isArray(j.electricals)&&j.electricals.every(x=>record(x)&&typeof x.id==='string'&&x.id&&typeof x.name==='string'&&x.name&&typeof x.description==='string')&&unique(j.electricals.map(x=>x.id))&&unique(j.electricals.map(x=>x.name.toLowerCase()));
return platesOK&&modulesOK&&electricalsOK&&unique(j.plates.map(t=>t.id))&&unique(j.components.map(c=>c.id))&&unique(j.plates.map(t=>`${t.capacity}|${t.rows}|${t.colorName}`))&&unique(j.components.map(c=>`${c.name.toLowerCase()}|${c.modules}|${c.color}`))};
const validProject=j=>{if(!record(j)||typeof j.name!=='string'||!record(j.rooms))return false;const ids=[];
if(j.roomElectricals!==undefined&&(!record(j.roomElectricals)||!Object.entries(j.roomElectricals).every(([room,items])=>Object.hasOwn(j.rooms,room)&&Array.isArray(items)&&items.every(x=>record(x)&&typeof x.id==='string'&&typeof x.electricalId==='string'&&typeof x.name==='string'&&typeof x.description==='string'))))return false;
for(const [room,plates] of Object.entries(j.rooms)){if(!room||!Array.isArray(plates))return false;for(const p of plates){if(!record(p)||typeof p.id!=='string'||!p.id||typeof p.plateTypeId!=='string'||typeof p.plateTypeLabel!=='string'||typeof p.name!=='string'||!Number.isInteger(p.capacity)||p.capacity<1||!Number.isInteger(p.rows)||p.rows<1||p.capacity%p.rows!==0||typeof p.color!=='string'||!/^#[0-9a-f]{6}$/i.test(p.colorCode)||typeof p.description!=='string'||!Array.isArray(p.items))return false;ids.push(p.id);const occupied=new Set,width=p.capacity/p.rows;
for(const item of p.items){if(!record(item)||typeof item.moduleId!=='string'||typeof item.moduleLabel!=='string'||typeof item.component!=='string'||![1,2].includes(item.modules)||typeof item.color!=='string'||!/^#[0-9a-f]{6}$/i.test(item.colorCode)||!Number.isInteger(item.at)||item.at<0||item.at+item.modules>p.capacity||item.at%width+item.modules>width)return false;for(let k=item.at;k<item.at+item.modules;k++){if(occupied.has(k))return false;occupied.add(k)}}}}return unique(ids)};

const schemaKey='switchboard-schema-final',projectKey='switchboard-project-final';
let SC,P;
try{SC=JSON.parse(localStorage.getItem(schemaKey))}catch(x){}
try{P=JSON.parse(localStorage.getItem(projectKey))}catch(x){}
if(!validSchema(SC))SC=seedSchema();
if(!validProject(P))P=seedProject();
SC.electricals??=[];
P.roomElectricals??={};
P.author=typeof P.author==='string'?P.author:'';
P.description=typeof P.description==='string'?P.description:'';
let iconActions=false;try{iconActions=localStorage.getItem('switchboard-icon-actions')==='true'}catch(x){}
let V={v:'home',homeTab:'overview',iconActions,collapsedRooms:{},collapsedElectricalRooms:{}};
const $=s=>document.querySelector(s);
const formError=(form,message)=>{if(!form)return;const previous=form.previousElementSibling;if(previous?.classList.contains('form-error'))previous.remove();const notice=document.createElement('div');notice.className='msg form-error';notice.setAttribute('role','alert');notice.textContent=message;form.before(notice)};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const saveSchema=()=>{try{localStorage.setItem(schemaKey,JSON.stringify(SC))}catch(x){}};
const saveProject=()=>{try{localStorage.setItem(projectKey,JSON.stringify(P))}catch(x){}};
const roomNames=()=>{const keys=Object.keys(P.rooms),order=Array.isArray(P.roomOrder)?P.roomOrder:[];return [...new Set(order.filter(n=>Object.hasOwn(P.rooms,n)))].concat(keys.filter(n=>!order.includes(n)))};
P.roomOrder=roomNames();
const plateTypeLabel=p=>`${p.capacity}M · ${p.rows} row${p.rows===1?'':'s'} · ${p.colorName}${p.description?' · '+p.description:''}`;
const moduleLabel=m=>`${m.name} (${m.modules}M · ${m.color})`;
const plateCountKey=p=>JSON.stringify([p.capacity,p.rows,p.color,p.colorCode,p.description]);
const moduleCountKey=i=>JSON.stringify([i.component,i.modules,i.color,i.colorCode]);
const cols=p=>p.capacity/p.rows;
const plates=r=>P.rooms[r]||[];
const projectDiagnostics=(project=P,schema=SC)=>{const issues=[],add=(kind,path,message)=>issues.push({kind,path,message});
if(!validSchema(schema))add('JSON error','schema','Schema fields, colours, entries or uniqueness rules are invalid.');
if(!validProject(project))add('JSON error','project','Project fields, plate layout or module placements are invalid.');
if(!record(project)||!record(schema))return issues;
const rooms=record(project.rooms)?project.rooms:{},types=Array.isArray(schema.plates)?schema.plates:[],modules=Array.isArray(schema.components)?schema.components:[],electricals=Array.isArray(schema.electricals)?schema.electricals:[];
if(Array.isArray(project.roomOrder))project.roomOrder.forEach((r,i)=>{if(!Object.hasOwn(rooms,r))add('Orphan','project.roomOrder['+i+']',`Room “${r}” no longer exists.`)});
for(const [room,placed] of Object.entries(rooms)){if(!Array.isArray(placed))continue;placed.forEach((plate,i)=>{if(!record(plate))return;const path=`project.rooms[${JSON.stringify(room)}][${i}]`;
if(!types.some(t=>record(t)&&t.id===plate.plateTypeId))add('Orphan',path+'.plateTypeId',`Plate “${plate.name||i+1}” refers to a missing plate type (${plate.plateTypeId||'empty ID'}).`);
if(!Array.isArray(plate.items))return;plate.items.forEach((item,j)=>{if(record(item)&&!modules.some(m=>record(m)&&m.id===item.moduleId))add('Orphan',`${path}.items[${j}].moduleId`,`Module “${item.component||j+1}” refers to a missing module type (${item.moduleId||'empty ID'}).`)})})}
if(record(project.roomElectricals))for(const [room,items] of Object.entries(project.roomElectricals)){if(!Object.hasOwn(rooms,room))add('Orphan',`project.roomElectricals[${JSON.stringify(room)}]`,`Electrical items belong to a missing room “${room}”.`);if(!Array.isArray(items))continue;items.forEach((item,i)=>{if(record(item)&&!electricals.some(x=>record(x)&&x.id===item.electricalId))add('Orphan',`project.roomElectricals[${JSON.stringify(room)}][${i}].electricalId`,`Electrical item “${item.name||i+1}” refers to a missing catalogue item (${item.electricalId||'empty ID'}).`)})}
return issues};
const addCount=(totals,id,label,color,colorCode)=>{const entry=totals[id]||(totals[id]={label,qty:0,color,colorCode});entry.qty++};
const rc=r=>{const m=Object.create(null);plates(r).forEach(p=>p.items.forEach(i=>addCount(m,moduleCountKey(i),i.moduleLabel)));return Object.keys(m).length?`<div class="mu" style="margin:6px 0">Room totals: ${Object.values(m).sort((a,b)=>a.label.localeCompare(b.label)).map(x=>`${e(x.label)} <span style="border-bottom:2px solid var(--ac);font-weight:700;color:var(--tx)">×${x.qty}</span>`).join(' · ')}</div>`:''};
const cur=()=>plates(V.room).find(p=>p.id===V.pid);
const occ=p=>{const o=Array(p.capacity).fill(-1);p.items.forEach((it,i)=>{for(let j=0;j<it.modules;j++)o[it.at+j]=i});return o};
function counts(){const m=Object.create(null),plateCounts=Object.create(null);let n=0,mods=0,used=0;for(const r in P.rooms)for(const p of P.rooms[r]){n++;addCount(plateCounts,plateCountKey(p),p.plateTypeLabel,p.color,p.colorCode);mods+=p.capacity;p.items.forEach(i=>{addCount(m,moduleCountKey(i),i.moduleLabel,i.color,i.colorCode);used+=i.modules})}return{m,n,mods,used,plateCounts}}
const colorTotalRows=totals=>{const groups=Object.create(null);Object.values(totals).forEach(x=>(groups[x.color||'Unspecified']??=[]).push(x));return Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(color=>`<tr><th colspan="2" class="color-total"><span class="swatch" style="background:${e(groups[color][0].colorCode||SC.colors[color]||'#eee')}"></span>${e(color)}</th></tr>${groups[color].sort((a,b)=>a.label.localeCompare(b.label)).map(x=>`<tr><td>${e(x.label)}</td><td><b>${x.qty}</b></td></tr>`).join('')}`).join('')};
function plate(p,ed){const c=cols(p),col=p.colorCode,o=occ(p),w=ed?54:34;let h='';
p.items.forEach((it,i)=>{const ihex=it.colorCode;h+=`<div class="cell it" title="${e(it.component)}" ${ed?`data-a="rm" data-i="${i}" role="button" tabindex="0" aria-label="Remove ${e(it.component)}"`:''} style="grid-row:${Math.floor(it.at/c)+1};grid-column:${it.at%c+1}/span ${it.modules};background:${ihex};border-color:rgba(0,0,0,.35);color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff">${e(it.component)}</div>`});
for(let k=0;k<p.capacity;k++)if(o[k]<0)h+=`<div class="cell em" ${ed?`data-a="put" data-k="${k}" role="button" tabindex="0" aria-label="Place module at position ${k+1}"`:''} style="grid-row:${Math.floor(k/c)+1};grid-column:${k%c+1};opacity:1;border-color:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(255,255,255,.85);color:#000;text-shadow:0 0 2px #fff,0 0 2px #fff">${ed?'+':''}</div>`;
return `<div class="plate" style="background:${col};width:min(100%,${c*w+16}px);grid-template-columns:repeat(${c},1fr);grid-auto-rows:${ed?56:36}px">${h}</div>`}
const catalogSort=(kind,value)=>`<label style="margin:0">Sort <select data-sort="${kind}" aria-label="Sort ${kind}" style="width:auto;margin-left:5px">${(kind==='plates'?[['size-asc','Size: small first'],['size-desc','Size: large first']]:[['name-asc','Name A–Z'],['name-desc','Name Z–A']]).map(([key,label])=>`<option value="${key}" ${value===key?'selected':''}>${label}</option>`).join('')}</select></label>`;
const catalogCompare=(mode,label,size)=>(a,b)=>{const names=label(a).localeCompare(label(b),undefined,{numeric:true}),sizes=size(a)-size(b);return mode==='name-desc'?-names:mode==='size-desc'?-sizes||names:sizes||names};
const catalogGroups=(items,colorOf,row,compare)=>{if(!items.length)return '<div class="card mu">No items yet.</div>';const grouped=Object.create(null);items.forEach(item=>{const color=colorOf(item)||'Unspecified';(grouped[color]=grouped[color]||[]).push(item)});const order=Object.keys(SC.colors).filter(n=>grouped[n]).concat(Object.keys(grouped).filter(n=>!Object.hasOwn(SC.colors,n)));return `<div class="card">${order.map((name,i)=>`${i?'<hr style="border:none;border-top:1px solid var(--bd);margin:14px 0">':''}<div class="row" style="margin:3px 0 8px;font-weight:700"><span style="width:16px;height:16px;border-radius:4px;border:1px solid var(--bd);background:${e(SC.colors[name]||'#eee')}"></span>${e(name)}</div>${grouped[name].sort(compare).map(row).join('')}`).join('')}</div>`};
const roomPlateForm=r=>`<form data-f="plate" class="card" style="margin-top:10px"><input type="hidden" name="r" value="${e(r)}"><b>Add plate to ${e(r)}</b>${SC.plates.length?`<label>Plate type<select name="type">${SC.plates.map(t=>`<option value="${e(t.id)}">${e(plateTypeLabel(t))}</option>`).join('')}</select></label><label>Plate name<input name="n" required value="Board ${counts().n+1}"></label><div class="row"><button class="btn p">Create &amp; fill plate</button><button type="button" class="btn" data-a="cancelAddPlate">Cancel</button></div>`:`<p>Add a plate type in + Plate first.</p><button type="button" class="btn" data-a="go" data-v="plate">+ Plate</button>`}</form>`;
const offerJSON=(data,name)=>{if(V.exportUrl)URL.revokeObjectURL(V.exportUrl);V.exportText=JSON.stringify(data,null,2);V.exportName=(name||'export').replace(/[^\w-]+/g,'_')+'.json';V.exportUrl=URL.createObjectURL(new Blob([V.exportText],{type:'application/json'}));const a=document.createElement('a');a.href=V.exportUrl;a.download=V.exportName;document.body.appendChild(a);a.click();a.remove();render()};
const resetView=()=>{if(V.exportUrl)URL.revokeObjectURL(V.exportUrl);V={v:'home',homeTab:'overview',iconActions:V.iconActions,collapsedRooms:{},collapsedElectricalRooms:{}}};
const reportRows=(totals,heading,empty)=>{const rows=Object.values(totals).sort((a,b)=>a.label.localeCompare(b.label));return `<div><h3>${heading}</h3>${rows.length?`<table><thead><tr><th>Item</th><th>Qty</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${e(x.label)}</td><td>${x.qty}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${empty}</p>`}</div>`};
const exportReport=()=>{const totals=counts();
const rooms=roomNames().map(name=>{const placed=P.rooms[name],capacity=placed.reduce((n,p)=>n+p.capacity,0),used=placed.reduce((n,p)=>n+p.items.reduce((m,i)=>m+i.modules,0),0),electricals=P.roomElectricals[name]||[],electricalCounts=Object.create(null);
electricals.forEach(x=>{const entry=electricalCounts[x.electricalId]??={name:x.name,qty:0};entry.qty++});
return `<section class="room"><h2>${e(name)}</h2><p>${placed.length} plate(s) · ${used}/${capacity} module spaces used</p>${rc(name)||'<p class="muted">No modules placed.</p>'}${electricals.length?`<p><b>Electricals:</b> ${Object.values(electricalCounts).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`${e(x.name)} ×${x.qty}`).join(' · ')}</p>`:''}<h3>Filled plates</h3>${placed.length?placed.map(p=>`<article class="placed"><h4>${e(p.name)}</h4><p>${e(p.plateTypeLabel)} · ${p.items.reduce((n,i)=>n+i.modules,0)}/${p.capacity} spaces used</p>${plate(p,false)}</article>`).join(''):'<p class="muted">No plates in this room.</p>'}</section>`}).join('');
